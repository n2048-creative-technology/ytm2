<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/png" href="/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <link rel="manifest" href="/manifest.json">
  <meta charset="UTF-8">
  <meta name="theme-color" content="#000000">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="viewport" content="user-scalable=no, width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Local VR Router - Phone</title>
  <link rel="stylesheet" href="/client.css">
  <script src="/client.js" defer></script>
</head>
<body>
  <video class="remote left" id="left-eye-remote-video" autoplay playsinline></video>
  <video class="remote right" id="right-eye-remote-video" autoplay playsinline></video>

  <video class="local left" id="left-eye-local-video" autoplay playsinline muted></video>
  <video class="local right" id="right-eye-local-video" autoplay playsinline muted></video>

  <div id="control-overlay">
    <label for="deviceName">Device Name</label>
    <input id="deviceName" type="text" placeholder="My VR Phone">
    <label for="receiverSelect" style="display:block; margin-top:6px;">Receive from</label>
    <select id="receiverSelect"></select>
    <label style="display:block; margin-top:6px;">
      <input id="vrModeCheckbox" type="checkbox" checked>
      VR (split view)
    </label>
    <p id="clientIdDisplay"></p>
    <p id="connection-status">Connecting…</p>
    <p id="roleState"></p>
    <p id="peerInfo"></p>
    <p id="errorDisplay" class="error"></p>
  </div>


</body>
</html>
