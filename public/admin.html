<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Local VR Router - Admin</title>
  <link rel="stylesheet" href="/admin.css">
  <script src="/qrcode.js" defer></script>
  <script src="/admin.js" defer></script>
</head>
<body>
  <header>
    <h1>Local VR Router Admin</h1>
    <p id="admin-connection-status">Status: Offline</p>
  </header>

  <main>
    <section>
      <h2>Connected Phones</h2>
      <div id="qr-wrapper">
        <p>Scan to open the phone client:</p>
        <canvas id="qrCanvas" width="128" height="128"></canvas>
        <p id="qrUrl"></p>
      </div>
      <div id="global-controls">
        <label>
          <input type="checkbox" id="globalLocalView">
          Toggle all Local Views
        </label>
        <label style="margin-left:12px;">
          <input type="checkbox" id="globalOverlay">
          Toggle all Overlays
        </label>
      </div>
      <div class="table-wrapper">
        <table id="phonesTable">
          <thead>
            <tr>
            <th>Preview</th>
            <th>ID</th>
            <th>Name</th>
            <th>Status</th>
            <th>Sending To</th>
            <th>Receiving From</th>
            <th>Sender</th>
            <th>Local View</th>
            <th>Overlay</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
      <p id="adminError" class="error"></p>
    </section>
  </main>
</body>
</html>
